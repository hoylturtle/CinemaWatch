name: Android release verification and signed updates
on:
  push:
    branches: [main]
    paths: ['app/**', 'fieldwatch-core/**', '*.gradle.kts', 'gradle/**', 'gradle.properties', '.github/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'release' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Install SDK and create disposable verification key
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          keytool -genkeypair -noprompt -keystore "$RUNNER_TEMP/verification.p12" -storetype PKCS12 -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 2 -dname "CN=CinemaWatch disposable verification"
      - name: Unit tests and seed instrumentation
        run: ./gradlew --no-daemon --max-workers=2 :app:assembleDebugAndroidTest :app:testDebugUnitTest :fieldwatch-core:testDebugUnitTest
      - name: Prepare actual published upgrade baseline
        env:
          CW_TEST_KEYSTORE_FILE: ${{ runner.temp }}/verification.p12
        run: python3 .github/scripts/prepare-upgrade.py
      - name: Build release candidate and matching instrumentation
        env:
          CW_TEST_KEYSTORE_FILE: ${{ runner.temp }}/verification.p12
        run: ./gradlew --no-daemon --max-workers=2 -PcinemaVerificationSigning=true -PcinemaTestBuildType=release :app:assembleRelease :app:assembleReleaseAndroidTest
      - name: Check production flags and prepare candidates
        run: |
          python3 .github/scripts/check-release.py app/build/outputs/apk/release/app-release.apk > build/release-manifest.json
          mkdir -p candidate
          cp app/build/outputs/apk/release/app-release.apk candidate/
          cp app/build/outputs/apk/androidTest/release/app-release-androidTest.apk candidate/
          cp build/upgrade-fixture.apk build/upgrade-seed-androidTest.apk candidate/
      - name: Save release candidates for verification
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-candidates-not-for-installation
          path: candidate/*.apk
          retention-days: 7
      - name: Save build evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-evidence-${{ github.run_id }}
          path: |
            app/build/reports
            app/build/test-results
            fieldwatch-core/build/test-results
            app/build/outputs/mapping/release
            build/*-evidence.json
            build/release-manifest.json
          if-no-files-found: ignore
      - name: Remove disposable private key
        if: always()
        run: rm -f "$RUNNER_TEMP/verification.p12"
  verify:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        api: [29, 35]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: verified-candidates-not-for-installation
          path: candidate
      - name: Enable emulator acceleration
        run: sudo chmod a+rw /dev/kvm
      - name: Verify historical upgrade and release interface
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/verify-android.sh
      - name: Save Android verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-evidence-api${{ matrix.api }}-${{ github.run_id }}
          path: |
            build/upgrade-check
            build/ui-screenshots
          if-no-files-found: ignore
  publish:
    needs: [build, verify]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      HAS_SIGNING: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Require persistent signing material
        if: env.HAS_SIGNING != 'true'
        run: |
          echo 'Persistent signing is not configured; refusing publication.' >> "$GITHUB_STEP_SUMMARY"
          exit 1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: verified-candidates-not-for-installation
          path: candidate
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager "build-tools;35.0.0"
      - name: Sign and verify fixed certificate and release flags
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: python3 .github/scripts/sign-release.py
      - name: Publish new signed preview and update feed
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version=$(python3 -c 'import json; print(json.load(open(".github/release-config.json"))["versionName"])')
          tag="v${version}-preview"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo 'Release tag already exists; bump the version rather than replacing published assets.' >&2
            exit 1
          fi
          gh release create "$tag" artifacts/* --target "$GITHUB_SHA" --prerelease --title "CinemaWatch ${version}" --notes-file docs/RELEASE_NOTES_CURRENT.md
