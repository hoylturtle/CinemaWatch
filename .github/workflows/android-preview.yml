name: Android build and signed updates
on:
  push:
    branches: [main]
    paths: ['app/**', 'fieldwatch-core/**', '*.gradle.kts', 'gradle/**', 'gradle.properties', '.github/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'release' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build older-version fixture
        run: |
          ./gradlew --no-daemon --max-workers=2 -PcinemaVersionCode=2 -PcinemaVersionName=upgrade-fixture :app:assembleDebug
          mkdir -p build
          cp app/build/outputs/apk/debug/app-debug.apk build/upgrade-fixture.apk
      - name: Build current APK and verify unit tests
        run: ./gradlew --no-daemon --max-workers=2 :app:assembleDebug :app:assembleDebugAndroidTest :app:testDebugUnitTest :fieldwatch-core:testDebugUnitTest
      - name: Enable emulator acceleration
        run: sudo chmod a+rw /dev/kvm
      - name: Verify replacement install and Android interface
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/verify-android.sh
      - name: Save verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-${{ github.run_id }}
          path: |
            app/build/reports
            app/build/test-results
            fieldwatch-core/build/test-results
            build/upgrade-check
            build/ui-screenshots
          if-no-files-found: ignore
      - name: Save candidate for the signing job
        uses: actions/upload-artifact@v4
        with:
          name: verified-candidate-not-for-installation
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
  publish:
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      HAS_SIGNING: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Require persistent signing material
        if: env.HAS_SIGNING != 'true'
        run: |
          echo 'Persistent signing is not configured; no APK or update feed will be published.' >> "$GITHUB_STEP_SUMMARY"
          exit 1
      - uses: actions/download-artifact@v4
        with:
          name: verified-candidate-not-for-installation
          path: candidate
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager "build-tools;35.0.0"
      - name: Sign and verify fixed certificate
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: python3 .github/scripts/sign-release.py
      - name: Publish signed APK and update feed
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version=$(python3 -c 'import json; print(json.load(open(".github/release-config.json"))["versionName"])')
          tag="v${version}-preview"
          cat > release-notes.md <<'NOTES'
          CinemaWatch 固定签名预览版，Android 10+。

          新增大堂、通道、办公区和放映层；新建影城自动创建，已有影城在设置中补充公共区域。0.3.0 可保留数据覆盖升级。

          原包名 com.cinemawatch；简体中文、繁体中文、英文。设置中点击检查更新，下载后验证包名、版本、SHA-256 与签名，再由系统确认覆盖安装。影院、资产、绑定与历史留在本地。

          0.1 / 0.2 使用过不同的临时签名，无法覆盖升级。本次先在旧版导出需要的历史再一次性换装；从 0.3 起保留同一签名，后续原位升级。不要安装 Actions 的临时测试候选包。

          CI 验证同签名的旧版本测试安装 → 覆盖安装 → 数据与语言保留，并验证资产、报告、语言和更新界面。现场 RF 扫描仍需真机验证。

          Fieldwatch v1.1.21，固定 5379a2049c351c2483f7f106ca68d5d6d5f00e64，保留 MIT License 与 attribution。
          NOTES
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" artifacts/* --clobber
          else
            gh release create "$tag" artifacts/* --target "$GITHUB_SHA" --prerelease --title "CinemaWatch ${version} 固定签名更新版" --notes-file release-notes.md
          fi
