name: Android preview APK
on:
  push:
    branches: [main]
    paths: ['.github/workflows/android-preview.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-preview-release
  cancel-in-progress: false
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build APK and verify unit tests
        run: ./gradlew --no-daemon --max-workers=2 :app:assembleDebug :app:testDebugUnitTest :fieldwatch-core:testDebugUnitTest
      - name: Prepare APK and checksum
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/CinemaWatch-0.1.0-preview.apk
          cd artifacts
          sha256sum CinemaWatch-0.1.0-preview.apk > SHA256.txt
      - name: Save downloadable build artifact
        uses: actions/upload-artifact@v4
        with:
          name: CinemaWatch-0.1.0-preview
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30
      - name: Publish preview APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cat > release-notes.md <<'NOTES'
          CinemaWatch 0.1.0 Android 预览版（Android 10+）

          支持简体中文、繁体中文、英文。默认跟随系统，不支持的语言回退简体中文，设置中可手动切换。

          影院／区域设置、Wi-Fi/BLE 巡检、授权资产登记、RSSI 状态、演示、历史记录与 CSV 导出。本地优先，不把无线地址当人数，不保存未授权信号标识。

          APK 使用调试签名。完整 UI 流程尚未通过模拟器验证，现场扫描及 Android 厂商限制仍需真机测试。详见仓库 docs/evidence/cinemawatch-v0.1.0/VALIDATION.md。

          Fieldwatch v1.1.21，固定 source commit 5379a2049c351c2483f7f106ca68d5d6d5f00e64；保留 MIT License 与 attribution。
          NOTES
          if gh release view v0.1.0-preview >/dev/null 2>&1; then
            gh release upload v0.1.0-preview artifacts/* --clobber
          else
            gh release create v0.1.0-preview artifacts/* --target "$GITHUB_SHA" --prerelease --title "CinemaWatch 0.1.0 三语言预览版" --notes-file release-notes.md
          fi
